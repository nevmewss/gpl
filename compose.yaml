services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
      - app_backups:/app/backups
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  app_backups:
  caddy_data:
  caddy_config:
